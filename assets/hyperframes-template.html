<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=1280" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 720px;
        height: 1280px;
        overflow: hidden;
        background: #0a0a0a;
        font-family: -apple-system, "SF Pro Display", "Inter", system-ui, sans-serif;
      }
      .clip {
        position: absolute;
        top: 0;
        left: 0;
        width: 720px;
        height: 1280px;
      }
      video { width: 720px; height: 1280px; object-fit: cover; }
      .caption {
        position: absolute;
        bottom: 220px;
        left: 40px;
        right: 40px;
        text-align: center;
        font-size: 38px;
        font-weight: 700;
        color: #fff;
        line-height: 1.25;
        letter-spacing: -0.02em;
      }
      .caption-bg {
        background: rgba(0,0,0,0.6);
        padding: 14px 22px;
        border-radius: 14px;
        display: inline-block;
      }
      .hyperframes-scene {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="DURATION_PLACEHOLDER"
      data-width="720"
      data-height="1280"
    >
<!-- ELEMENTS_PLACEHOLDER -->
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

// TIMELINE_PLACEHOLDER

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
